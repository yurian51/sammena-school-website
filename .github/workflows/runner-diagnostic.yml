name: Runner Diagnostic

on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    name: Runner Smoke Test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Runner started
        run: echo "GitHub Actions runner started successfully"
      - name: Runtime
        run: |
          node --version
          npm --version
          corepack --version
      - name: Repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify package manager contract
        run: |
          test -f package.json
          test -f pnpm-lock.yaml
          corepack pnpm --version
          node -e 'const p=require("./package.json"); if(p.packageManager!=="pnpm@10.15.0") process.exit(1); console.log(`packageManager=${p.packageManager}`)'
