name: Secure Next.js Upgrade

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    name: Upgrade Next.js and regenerate lockfile
    if: github.event_name == 'push' && github.event.head_commit.message != 'security: bootstrap Next.js upgrade [skip ci]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Upgrade Next.js
        run: pnpm update next@16.3.6 --save-exact

      - name: Verify dependency state
        run: |
          pnpm exec next --version
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test
          pnpm run test:data
          pnpm run test:portal-schema
          pnpm run build

      - name: Commit regenerated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "security: upgrade Next.js to 16.3.6 [skip ci]"
          git push
