name: Smoke

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner Smoke Test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify runner
        run: |
          echo "GitHub Actions runner started successfully"
          node --version
          npm --version
